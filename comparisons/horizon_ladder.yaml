# Pre-declared comparison, family 2. Committed 2026-08-24, before any
# R6_waveform run exists and before any of the four primary horizons below has
# been scored by any arm.
#
# If ledger/runs.jsonl contains a run tagged comparison=horizon_ladder whose
# commit does not descend from this file's first commit, the pre-declaration is
# void and every arm in this family must be rerun. check_provenance.py enforces
# this, the same test D-008 imposes on acq_context_audit.

name: horizon_ladder
declared: 2026-08-24
declared_by: A3
status: open
opened_by: D-047
closes: D-037

hypothesis: >
  The advantage of acquisition context over demographics decreases as the
  outcome horizon lengthens, and the fraction of the waveform arm's above-chance
  discrimination that acquisition context recovers decreases with it. Triage
  urgency predicts imminent deterioration; age predicts eventual death.

# ---------------------------------------------------------------------------
# Why this family exists, and the dependency it carries
# ---------------------------------------------------------------------------
provenance_caveat: >
  This hypothesis was GENERATED by the P1 result recorded in D-036, which
  observed the acquisition-context advantage at 28-day mortality (+0.0624) and
  at 365-day mortality (-0.0216). Those two labels are therefore not evidence
  for it. The primary test below is restricted to the four mortality horizons
  that no arm in this project has ever been scored on, so that it is a genuine
  out-of-sample test of a hypothesis formed on other data. The all-six version
  is reported as secondary and is explicitly labelled as containing the two
  generating observations. Neither version is described in the manuscript as
  having been planned before P1, because it was not.

# ---------------------------------------------------------------------------
# Labels
# ---------------------------------------------------------------------------
primary_labels:
  # Never scored by any arm in this project. The out-of-sample ladder.
  - {label: deterioration_mortality_1d,   horizon_days: 1}
  - {label: deterioration_mortality_7d,   horizon_days: 7}
  - {label: deterioration_mortality_90d,  horizon_days: 90}
  - {label: deterioration_mortality_180d, horizon_days: 180}

generating_labels:
  # Scored in P1. Retained and reported, never counted as confirmation.
  - {label: deterioration_mortality_28d,  horizon_days: 28}
  - {label: deterioration_mortality_365d, horizon_days: 365}

anchor_label:
  # A short-horizon deterioration outcome, not a mortality horizon. Reported as
  # context beside the ladder; deliberately NOT part of any trend statistic,
  # because it is a different outcome rather than the same outcome at a
  # different distance, and mixing the two would make the trend uninterpretable.
  - {label: deterioration_icu_24h, horizon_days: 1, outcome: icu_admission}

excluded_labels:
  # Excluded now, before any result is seen, with the reason stated.
  - label: deterioration_mortality_stay
    reason: >
      Not a time horizon. It is "died before discharge", which is not orderable
      on the day axis the ladder is built on, and it carries 9 positives in the
      test fold against a prevalence of 0.0008 (D-031 records the same problem
      at cohort level). Including it would add an uninformative test to the Holm
      family and could only weaken every other test in it.

# ---------------------------------------------------------------------------
# Quantities
# ---------------------------------------------------------------------------
primary_quantity: acq_advantage_trend
primary_definition: >
  For each primary label h, delta(h) = AUROC(R3_acqctx_pre, h) -
  AUROC(R2_demo, h), computed as a paired patient-clustered bootstrap on the
  difference. The trend statistic is the Spearman rank correlation between
  horizon_days and delta(h) across the four primary labels, with a
  patient-clustered bootstrap interval on the correlation itself: patients are
  resampled once per replicate, all four deltas are recomputed on that
  resample, and the correlation is recomputed from them.
primary_success: >
  The hypothesis is supported if the Spearman correlation is negative and its
  95 percent patient-clustered interval excludes zero. Any other outcome,
  including a correlation whose interval spans zero, is reported as the
  hypothesis not being supported.

secondary_quantity: recovery_ratio_trend
secondary_definition: >
  For each primary label h, RR(h) = (AUROC(R3_acqctx_pre, h) - 0.5) /
  (AUROC(R6_waveform, h) - 0.5), with a paired patient-clustered bootstrap
  interval on the ratio itself. The trend statistic is the Spearman rank
  correlation between horizon_days and RR(h), interval computed as above.
  Undefined where the denominator interval includes zero; that case is reported
  as undefined rather than clipped, imputed, or dropped.
secondary_success: >
  Supported if the correlation is negative with an interval excluding zero.

tertiary_quantity: acq_advantage_trend_all_six
tertiary_definition: >
  The primary trend statistic recomputed over all six mortality horizons,
  including the two generating labels. Reported for completeness and always
  captioned as containing the observations that generated the hypothesis.

# ---------------------------------------------------------------------------
# Arms
# ---------------------------------------------------------------------------
arms:
  - {id: R2_demo,        inputs: [demographics], role: baseline}
  - {id: R3_acqctx_pre,  inputs: [acq_pre],      role: confirmatory}
  - {id: R6_waveform,    inputs: [waveform],     role: reference}

# ---------------------------------------------------------------------------
# Multiplicity. Fixed now, does not grow.
# ---------------------------------------------------------------------------
family:
  members:
    # Per-horizon paired contrasts on the four primary labels, plus the two
    # trend statistics. Six tests.
    - {test: paired_diff, contrast: [R3_acqctx_pre, R2_demo], label: deterioration_mortality_1d}
    - {test: paired_diff, contrast: [R3_acqctx_pre, R2_demo], label: deterioration_mortality_7d}
    - {test: paired_diff, contrast: [R3_acqctx_pre, R2_demo], label: deterioration_mortality_90d}
    - {test: paired_diff, contrast: [R3_acqctx_pre, R2_demo], label: deterioration_mortality_180d}
    - {test: trend, quantity: acq_advantage_trend}
    - {test: trend, quantity: recovery_ratio_trend}
  correction: holm
  alpha: 0.05
  note: >
    This family is separate from acq_context_audit and carries its own Holm
    correction. The two are never pooled. acq_context_audit's family was fixed
    on 2026-08-23 and does not grow; adding these tests to it would be the
    post-hoc family expansion this project exists to audit in other work.

analysis: >
  Patient-clustered percentile bootstrap, 10,000 resamples, resampling unit
  subject_id, via scripts/bootstrap.py. Five seeds per arm per label, reported
  as mean and spread; a between-arm difference not clearly larger than the
  measured noise floor is reported as no difference. Every reported number
  travels with its item count, group count and resample count.

relationship_to_the_failed_primary: >
  The pre-declared primary contrast of acq_context_audit, at
  deterioration_mortality_365d, FAILED (D-036). This family does not retire that
  failure and is not a substitute for it. Both are reported, and the abstract
  states the failure.

exploratory_policy: >
  Any label, arm, contrast or statistic not listed above is exploratory, is
  excluded from this family's correction, and is described as exploratory in the
  manuscript.
